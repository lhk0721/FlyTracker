[project]
name = "flytracker"
version = "0.1.0"
description = "초파리와 제한 시야각 조준기의 강화학습 환경"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.4",
    "tensorboard>=2.15",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flytracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
